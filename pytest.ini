[pytest]
# Pytest configuration for Ventiv to Riskonnect Migration Tool

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Add src to Python path
pythonpath = .

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require network/DB)
    ui: UI tests (require PyQt5)
    slow: Slow tests (>1 second)
    ai: Tests requiring AI models (sentence-transformers)

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv

# Minimum Python version
minversion = 3.9
